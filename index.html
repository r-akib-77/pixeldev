<div id="app">
  <canvas id="game" width="960" height="608" role="img" aria-label="Interactive pixel-art world: Rakib's developer room surrounded by a night garden. Walk with WASD or arrow keys, or the on-screen pad. Press E near a highlighted object to open its section, or click a label."></canvas>
  <div id="hotspots"></div>
  <div id="vig" aria-hidden="true"></div>

  <header id="hud" aria-label="Player profile">
    <canvas id="hudPortrait" width="24" height="24" aria-hidden="true"></canvas>
    <div class="hud-info">
      <div class="hud-name" id="hudName">Rakib</div>
      <div class="hud-role" id="hudRole">Full Stack Developer</div>
      <div class="hud-stats" aria-hidden="true">
        <span class="hearts" id="hudHearts"></span>
        <span class="xp"><i id="hudXp"></i></span>
        <span class="lvl">Lv. 1</span>
      </div>
    </div>
  </header>

  <div id="controls" aria-label="Game utilities">
    <button id="btnSound" class="ctl-btn" aria-label="Sound: off" aria-pressed="false" title="Sound">
      <svg class="ic on"><use href="#i-sound"/></svg><svg class="ic off"><use href="#i-mute"/></svg>
    </button>
    <button id="btnHelp" class="ctl-btn" aria-label="Help" title="Help">
      <svg class="ic"><use href="#i-help"/></svg>
    </button>
    <button id="btnMap" class="ctl-btn wide" aria-label="View map" title="View Map">
      <svg class="ic"><use href="#i-map"/></svg><span class="ctl-label">View Map</span>
    </button>
    <button id="btnFs" class="ctl-btn" aria-label="Fullscreen" title="Fullscreen">
      <svg class="ic"><use href="#i-fs"/></svg>
    </button>
  </div>

  <nav id="navbar" aria-label="Portfolio sections"></nav>

  <button id="menuBtn" aria-label="Open menu"><svg class="ic"><use href="#i-menu"/></svg></button>

  <div id="dpad" aria-label="Movement controls">
    <button class="dpad-btn" data-dir="up"    style="grid-area:1/2" aria-label="Move up"><svg class="ic"><use href="#i-chev-u"/></svg></button>
    <button class="dpad-btn" data-dir="left"  style="grid-area:2/1" aria-label="Move left"><svg class="ic"><use href="#i-chev-l"/></svg></button>
    <button class="dpad-btn" data-dir="right" style="grid-area:2/3" aria-label="Move right"><svg class="ic"><use href="#i-chev-r"/></svg></button>
    <button class="dpad-btn" data-dir="down"  style="grid-area:3/2" aria-label="Move down"><svg class="ic"><use href="#i-chev-d"/></svg></button>
  </div>
  <button id="interactBtn" aria-label="Interact with the nearest object"><svg class="ic"><use href="#i-hand"/></svg></button>

  <div id="prompt" aria-hidden="true"><kbd id="promptKey">E</kbd><span id="promptTxt">Interact</span></div>

  <div id="panels"></div>
  <div id="backdrop" aria-hidden="true"></div>
  <div id="tip" role="note" hidden></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="sr" class="sr-only" aria-live="polite"></div>

  <div id="boot" aria-hidden="true"><div class="boot-in"><b>PIXELDEV</b><span>A Living Pixel-Art World</span></div></div>
  <noscript><div class="nojs">PixelDev is an interactive world and needs JavaScript enabled.</div></noscript>
</div>

<script src="scripts/ui.js"></script>

</html>
